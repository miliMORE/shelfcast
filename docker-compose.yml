services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shelfcast
      POSTGRES_PASSWORD: shelfcast
      POSTGRES_DB: shelfcast
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelfcast -d shelfcast"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    profiles: ["s3"]

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/shelfcast || true;
      exit 0;
      "
    profiles: ["s3"]

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://shelfcast:shelfcast@postgres:5432/shelfcast?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: local-dev-secret-change-me
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      TTS_PROVIDER: mock
      STORAGE_DRIVER: local
      STORAGE_ROOT: /app/storage
    volumes:
      - appstorage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && node server.js"

  worker:
    build: .
    environment:
      DATABASE_URL: postgresql://shelfcast:shelfcast@postgres:5432/shelfcast?schema=public
      NEXTAUTH_SECRET: local-dev-secret-change-me
      TTS_PROVIDER: mock
      STORAGE_DRIVER: local
      STORAGE_ROOT: /app/storage
      WORKER_POLL_MS: "2000"
      PROCESS_JOBS: "1"
    volumes:
      - appstorage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
    command: ["npx", "tsx", "src/worker.ts"]

volumes:
  pgdata:
  miniodata:
  appstorage:
