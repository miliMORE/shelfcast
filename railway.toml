# Railway: create TWO services from this repo (web + worker), plus Postgres plugin.
# Web start: npx prisma migrate deploy && node server.js  (Dockerfile CMD)
# Worker start: npx tsx src/worker.ts
# Share the same env vars across both services.
# Add an S3-compatible bucket (R2/S3) and set STORAGE_DRIVER=s3 + S3_* vars.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
# TEMPORARY: resolves the failed 20260909163000_oauth_google_nullable_password
# migration (P3009) that is blocking deploys, then applies migrations normally.
# Revert to `npx prisma migrate deploy` once this has deployed successfully.
preDeployCommand = "npx prisma migrate resolve --rolled-back 20260909163000_oauth_google_nullable_password && npx prisma migrate deploy"
